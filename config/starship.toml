# Starship default config for macsmith.
# Run `starship preset --list` and `starship explain` to explore alternatives.
# Overrides go here or in ~/.config/starship.toml (this file).

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$ruby\
$swift\
$dotnet\
$kubernetes\
$terraform\
$aws\
$gcloud\
$azure\
$docker_context\
$nix_shell\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

[kubernetes]
# Show Kubernetes context only in project directories; remove the detection lists for always-on display.
disabled = false
detect_files = ["k8s.yaml", "k8s.yml", "kustomization.yaml", "skaffold.yaml", "helmfile.yaml", "Chart.yaml"]
detect_folders = ["k8s", "manifests", "helm", "charts"]
format = '[$symbol$context( \($namespace\))]($style) '

[aws]
format = '[$symbol($profile )(\($region\) )]($style)'
symbol = "aws "

[gcloud]
format = '[$symbol$account(@$domain)(\($region\))]($style) '
disabled = true

[azure]
disabled = true

[docker_context]
only_with_files = true
detect_files = ["Dockerfile"]

[nix_shell]
format = '[$symbol$state( \($name\))]($style) '

# Ignore Ruby environment variables so the module appears only in Ruby projects.
[ruby]
detect_variables = []

# Detect language modules from project markers rather than file extensions.
[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
detect_extensions = []

[nodejs]
format = "[$symbol($version )]($style)"
detect_extensions = []

[rust]
detect_extensions = []

[golang]
detect_extensions = []

[swift]
detect_extensions = []

[terraform]
format = "[$symbol$workspace]($style) "
detect_extensions = []
