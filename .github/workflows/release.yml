name: Release

# Auto-release only when all required workflows pass on the same SHA.
# Manual flows:
#   A. gh release create vYYYY.MM.DD-<short-sha> --generate-notes
#   B. GitHub UI → Releases → Draft a new release → Publish
#   C. Actions → Release → Run workflow (supply a version string)
on:
  workflow_run:
    workflows: ["macOS Test"]
    types: [completed]
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

# One release run per target commit; never cancel an in-flight publish.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  check-workflows:
    name: Check All Workflows Status
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Run for every trigger so release/workflow_dispatch can't bypass CI gating
    outputs:
      all-success: ${{ steps.check.outputs.all-success }}
      head-sha: ${{ steps.check.outputs.head-sha }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Wait for all workflows and check status
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Resolve the SHA we're gating on based on the trigger
            let headSha;
            if (context.eventName === 'workflow_run') {
              const workflowRun = context.payload.workflow_run;
              headSha = workflowRun.head_sha;
              console.log(`Triggered by workflow_run "${workflowRun.name}" (conclusion: ${workflowRun.conclusion})`);
            } else if (context.eventName === 'release') {
              // For `release` events GITHUB_SHA is the SHA of the commit that
              // was tagged. `target_commitish` on the release object can be
              // a branch name (e.g. "main"), not a SHA, so filtering
              // workflow_runs by it would miss runs and block legitimate
              // releases. Resolve via the tag ref instead.
              const tagName = context.payload.release.tag_name;
              try {
                const { data: ref } = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`
                });
                // Lightweight tags return commit directly; annotated tags need deref
                if (ref.object.type === 'commit') {
                  headSha = ref.object.sha;
                } else {
                  const { data: tag } = await github.rest.git.getTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_sha: ref.object.sha
                  });
                  headSha = tag.object.sha;
                }
              } catch (err) {
                console.log(`Could not resolve tag ${tagName} via API, falling back to context.sha`);
                headSha = context.sha;
              }
              console.log(`Triggered by release (tag: ${tagName})`);
            } else if (context.eventName === 'workflow_dispatch') {
              headSha = context.sha;
              console.log(`Triggered by workflow_dispatch on ref: ${context.ref}`);
            } else {
              throw new Error(`Unsupported trigger: ${context.eventName}`);
            }
            console.log(`Gating on commit: ${headSha}`);
            // Expose the gated SHA so create-release checks out exactly this
            // commit (not the moving branch tip) and packages what was validated.
            core.setOutput('head-sha', headSha);

            // Required workflows that must succeed
            const requiredWorkflows = ['Checks', 'macOS Test', 'Security Scan'];
            
            // Wait a bit for all workflows to complete (they might finish almost simultaneously)
            await new Promise(resolve => setTimeout(resolve, 10000));
            
            // Get all workflow runs for this commit
            let allCompleted = false;
            let attempts = 0;
            const maxAttempts = 30; // Wait up to 5 minutes (30 * 10 seconds)
            
            while (!allCompleted && attempts < maxAttempts) {
              attempts++;
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                per_page: 100
              });
              
              const workflowStatuses = {};
              
              // Check status of all required workflows
              // Keep the NEWEST run per workflow name (largest id == most
              // recent). listWorkflowRunsForRepo returns newest-first, so a
              // plain last-write keeps the OLDEST run — a stale green could
              // then mask a fresh red for the same commit and ship a bad build.
              for (const run of runs.workflow_runs) {
                if (requiredWorkflows.includes(run.name)) {
                  const existing = workflowStatuses[run.name];
                  if (!existing || run.id > existing.id) {
                    workflowStatuses[run.name] = {
                      status: run.status,
                      conclusion: run.conclusion,
                      id: run.id
                    };
                  }
                }
              }
              
              // Check if all required workflows are present and completed
              allCompleted = true;
              let allSuccess = true;
              
              for (const reqWorkflow of requiredWorkflows) {
                const status = workflowStatuses[reqWorkflow];
                if (!status) {
                  console.log(`WAITING: Workflow "${reqWorkflow}" not found yet (attempt ${attempts}/${maxAttempts})`);
                  allCompleted = false;
                  break;
                }
                
                if (status.status !== 'completed') {
                  console.log(`WAITING: Workflow "${reqWorkflow}" is still running (status: ${status.status}, attempt ${attempts}/${maxAttempts})`);
                  allCompleted = false;
                  break;
                }
                
                if (status.conclusion !== 'success') {
                  console.log(`ERROR: Workflow "${reqWorkflow}" failed (conclusion: ${status.conclusion})`);
                  allSuccess = false;
                } else {
                  console.log(`OK: Workflow "${reqWorkflow}" succeeded`);
                }
              }
              
              if (allCompleted) {
                if (!allSuccess) {
                  console.log('ERROR: One or more workflows failed. Release will not be created.');
                  core.setOutput('all-success', 'false');
                  return;
                }
                break;
              }
              
              // Wait before next check
              if (attempts < maxAttempts) {
                console.log(`Waiting 10 seconds before next check... (attempt ${attempts}/${maxAttempts})`);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            
            if (!allCompleted) {
              console.log('TIMEOUT: Not all workflows completed within the timeout period. Release will not be created.');
              core.setOutput('all-success', 'false');
              return;
            }
            
            console.log('OK: All required workflows succeeded! Proceeding with release...');
            core.setOutput('all-success', 'true');

  create-release:
    name: Create Release Package
    runs-on: ubuntu-latest
    needs: [check-workflows]
    # Grant only the permissions needed to publish and attest the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Block artifact publication unless workflow gating succeeds.
    if: needs.check-workflows.outputs.all-success == 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the exact SHA that passed gating, not the moving branch tip,
          # so `git archive HEAD` packages the commit that was validated.
          ref: ${{ needs.check-workflows.outputs.head-sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: version
        env:
          # Pass event-derived values through the environment instead of script interpolation.
          VERSION_INPUT: ${{ github.event.inputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="$VERSION_INPUT"
          elif [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Auto-generate version based on date and commit SHA
            COMMIT_SHA="$HEAD_SHA"
            SHORT_SHA="${COMMIT_SHA:0:7}"
            DATE=$(date +%Y.%m.%d)
            VERSION="v${DATE}-${SHORT_SHA}"
            echo "Auto-generated version: $VERSION"
          fi
          # Accept only tag-shaped version values.
          if [[ ! "$VERSION" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "ERROR: invalid version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Create release package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="macsmith-${VERSION}"

          # Package with the working tree's .gitattributes export rules.
          git archive \
            --format=tar \
            --worktree-attributes \
            --prefix="${PACKAGE_NAME}/" \
            HEAD \
            | tar -x

          # Embed the resolved version for installs without Git metadata.
          printf '%s\n' "$VERSION" > "$PACKAGE_NAME/VERSION"

          # Create zip (git archive gave us a clean directory; no extra excludes needed)
          (cd "$PACKAGE_NAME" && zip -qr "../${PACKAGE_NAME}.zip" .)

          # Create checksum
          sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256"
          
          # Set outputs
          echo "zip_file=${PACKAGE_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "checksum_file=${PACKAGE_NAME}.zip.sha256" >> "$GITHUB_OUTPUT"
          
          # Read checksum content for release notes
          CHECKSUM_CONTENT=$(cat "${PACKAGE_NAME}.zip.sha256")
          echo "checksum_content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHECKSUM_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Smoke-test release artifact
        env:
          ZIP_FILE: ${{ steps.package.outputs.zip_file }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -qq -y zsh
          fi
          unzip -t "$ZIP_FILE"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          unzip -q "$ZIP_FILE" -d "$smoke_dir"

          for required in install.sh dev-tools.sh bootstrap.sh zsh.sh macsmith.sh \
            scripts/nix-macos-maintenance.sh scripts/uninstall-nix-macos.sh \
            scripts/uninstall-macsmith.sh scripts/setup-github.sh \
            config/starship.toml config/profiles.conf VERSION; do
            test -f "$smoke_dir/$required" || {
              echo "Missing release file: $required" >&2
              exit 1
            }
          done
          test "$(cat "$smoke_dir/VERSION")" = "$EXPECTED_VERSION"
          zsh -n "$smoke_dir"/{install.sh,dev-tools.sh,bootstrap.sh,zsh.sh,macsmith.sh}
          bash -n "$smoke_dir"/scripts/*.sh

          if unzip -Z1 "$ZIP_FILE" | grep -Eq '^(\.git|\.github|\.vscode|tests/|background/|quick-test\.sh|CLAUDE\.md)'; then
            echo "Development-only files leaked into release artifact" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package.outputs.zip_file }}

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## macsmith ${{ steps.version.outputs.version }}
            
            ### Installation
            1. Download and extract the zip file
            2. Run `./install.sh` for shell setup (Starship + zsh plugins via Homebrew)
            3. (Optional) Run `./dev-tools.sh` to install package managers and language tools
            
            ### Files included
            Packaged with `git archive` respecting `.gitattributes` `export-ignore` rules.

            Main files:
            - `install.sh` — Shell setup installation script
            - `dev-tools.sh` — Language tools installer (pyenv, nvm, chruby, rustup, swiftly, uv, bun, pnpm, deno, …)
            - `bootstrap.sh` — One-liner bootstrap (clones + runs install.sh)
            - `zsh.sh` — Zsh configuration installed as `~/.zshrc`
            - `macsmith.sh` — The maintenance binary (becomes `~/.local/bin/macsmith`)
            - `config/` — Default Starship config and shared package-profile manifest
            - `scripts/` — Nix maintenance helper
            - `README.md`, `LICENSE`, `ASSETS.md`
            - `VERSION` — Injected by the release pipeline so `install.sh` knows what it is
            
            ### Checksums
            ```
            ${{ steps.package.outputs.checksum_content }}
            ```
          files: |
            ${{ steps.package.outputs.zip_file }}
            ${{ steps.package.outputs.checksum_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            ${{ steps.package.outputs.zip_file }}
            ${{ steps.package.outputs.checksum_file }}
