name: macOS Test

# Lean core-only check (no profiles / toolchains / update).
on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-platform:
    name: macOS Core Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: |
          for f in install.sh dev-tools.sh zsh.sh macsmith.sh bootstrap.sh quick-test.sh; do
            zsh -n "$f" && echo "OK  zsh -n $f" || { echo "::error::syntax error in $f"; exit 1; }
          done
          for f in scripts/*.sh; do
            bash -n "$f" && echo "OK  bash -n $f" || { echo "::error::syntax error in $f"; exit 1; }
          done

      - name: Core install (no profiles, no language toolchains)
        env:
          NONINTERACTIVE: "1"
          MACSMITH_SKIP_PROFILES: "1"
        run: |
          fresh_home="$(mktemp -d)"
          {
            echo "HOME=$fresh_home"
            echo "ZDOTDIR=$fresh_home"
            echo "XDG_DATA_HOME=$fresh_home/.local/share"
            echo "XDG_CONFIG_HOME=$fresh_home/.config"
            echo "XDG_CACHE_HOME=$fresh_home/.cache"
          } >> "$GITHUB_ENV"
          export HOME="$fresh_home" ZDOTDIR="$fresh_home"
          mkdir -p "$fresh_home/.local/share" "$fresh_home/.config" "$fresh_home/.cache"
          chmod +x install.sh macsmith.sh zsh.sh
          echo "HOME=$HOME"
          ./install.sh 2>&1 | tee install.log
          rc="${PIPESTATUS[0]}"
          if grep -q 'Critical:' install.log; then
            echo "::error::install.sh reported a CRITICAL failure"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::install.sh exited $rc (non-critical; core is validated next)"
          fi

      - name: Validate core artifacts
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:$HOME/.local/bin:$PATH"
          fail=0
          check() { if eval "$1"; then echo "OK  $2"; else echo "::error::$2"; fail=1; fi; }
          check '[ -f "$HOME/.zshrc" ]'                                        '~/.zshrc written'
          check '[ -f "$HOME/.zprofile" ]'                                     '~/.zprofile written'
          check '[ -x "$HOME/.local/bin/macsmith" ]'                           'macsmith binary installed'
          check '[ -x "$HOME/.local/bin/uninstall-macsmith" ]'                 'uninstall-macsmith installed'
          check '[ -x "$HOME/.local/bin/uninstall-nix-macos" ]'                'uninstall-nix-macos installed'
          check '[ -x "$HOME/.local/bin/setup-github" ]'                       'setup-github installed'
          check 'grep -q "FINAL PATH CLEANUP (FOR .ZPROFILE)" "$HOME/.zprofile"' '.zprofile managed PATH block'
          check 'grep -q "macsmith_bin" "$HOME/.zshrc"'                        '.zshrc macsmith aliases'
          check 'grep -q "starship init zsh" "$HOME/.zshrc"'                   '.zshrc starship init'
          check 'grep -q "zsh-syntax-highlighting.zsh" "$HOME/.zshrc"'         '.zshrc syntax-highlighting'
          check 'grep -q "zsh-autosuggestions.zsh" "$HOME/.zshrc"'             '.zshrc autosuggestions'
          check 'command -v starship >/dev/null'                              'starship on PATH'
          check 'command -v fzf >/dev/null'                                   'fzf on PATH'
          check 'head -n "$(wc -l < zsh.sh)" "$HOME/.zshrc" | cmp -s zsh.sh -' 'zsh.sh installed verbatim'
          if zsh -lc 'command -v macsmith >/dev/null'; then
            echo "OK  macsmith on login-shell PATH"
          else
            echo "::error::macsmith not on login-shell PATH"; fail=1
          fi
          if zsh -lc 'p="$(brew --prefix 2>/dev/null)"; [[ -n "$p" && "$PATH" == "$p/bin:"* ]]'; then
            echo "OK  Homebrew first on login PATH"
          else
            echo "::error::Homebrew not first on login PATH"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: macsmith commands (verify / versions / doctor / help)
        run: |
          zsh -lc 'macsmith verify' 2>&1 | tee verify.txt
          grep -qE '^[A-Za-z][A-Za-z0-9_.-]*[[:space:]]+(OK|WARN|Not installed)' verify.txt \
            || { echo "::error::verify output format"; exit 1; }
          grep -q 'Summary:' verify.txt || { echo "::error::verify has no summary"; exit 1; }
          zsh -lc 'macsmith versions' 2>&1 | grep -q 'TOOL VERSIONS' \
            || { echo "::error::versions failed"; exit 1; }
          zsh -lc 'macsmith doctor' 2>&1 | tee doctor.txt
          grep -qiE 'check|version|Homebrew|PATH' doctor.txt \
            || { echo "::error::doctor produced no diagnostics"; exit 1; }
          zsh -lc 'macsmith --help' 2>&1 | grep -qE 'update|verify|versions' \
            || { echo "::error::help output"; exit 1; }
          zsh -lc 'macsmith bogus-command' 2>&1 | grep -qiE 'unknown command|usage' \
            || { echo "::error::unknown-command handling"; exit 1; }
          echo "commands OK"

      - name: Uninstaller dry-runs (must preview, never act)
        run: |
          zsh -lc 'uninstall-macsmith --dry-run' 2>&1 | tee um.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::uninstall-macsmith --dry-run failed"; exit 1; }
          zsh -lc 'uninstall-nix-macos --dry-run' 2>&1 | tee un.txt
          [ -s un.txt ] || { echo "::error::uninstall-nix-macos --dry-run produced no output"; exit 1; }
          # ignore [DRY ] preview lines
          if grep -iE 'deleteVolume|Deleting APFS|Deleted volume|Erasing' un.txt | grep -qvF '[DRY ]'; then
            echo "::error::dry-run appears to have performed a destructive action"
            exit 1
          fi
          echo "dry-runs previewed safely"

      - name: quick-test.sh (syntax + presence + regression suite)
        run: |
          chmod +x quick-test.sh
          ./quick-test.sh 2>&1 | tee quick_test.txt
          rc="${PIPESTATUS[0]}"
          [ "$rc" -eq 0 ] || { echo "::error::quick-test.sh exited $rc"; exit 1; }
          grep -q 'Test Complete' quick_test.txt || { echo "::error::quick-test.sh did not complete"; exit 1; }
          grep -q 'All regression tests passed' quick_test.txt || { echo "::error::regression suite did not pass"; exit 1; }

      - name: dev-tools.sh dry modes (detection only, installs nothing)
        run: |
          chmod +x dev-tools.sh
          ./dev-tools.sh test  2>&1 | grep -qiE 'Testing Tool Detection|Found:|Missing:' \
            || { echo "::error::dev-tools.sh test mode"; exit 1; }
          ./dev-tools.sh check 2>&1 | grep -qiE 'Checking Installed Tools|already installed|Would install' \
            || { echo "::error::dev-tools.sh check mode"; exit 1; }
          echo "dev-tools detection OK"

  macos-test:
    name: macOS Functionality Test
    runs-on: ubuntu-latest
    needs: [macos-platform]
    if: always()
    steps:
      - name: Require every macOS platform job
        env:
          PLATFORM_RESULT: ${{ needs.macos-platform.result }}
        run: |
          test "$PLATFORM_RESULT" = success || {
            echo "macOS platform matrix failed: $PLATFORM_RESULT" >&2
            exit 1
          }
